# Render Blueprint: Mobi API + PostgreSQL. The static frontend is a separate Static Site.
services:
  - type: web
    name: mobi-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: mobi-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: CREDENTIALS_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: mobi-db
    plan: free
